{% extends 'base.html' %}
{% block title %}E-mail Enviado - VetCare{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4 text-center">
                <h4 class="text-success fw-bold mb-3">Verifique seu E-mail</h4>
                <p class="text-muted">
                    Se existir uma conta vinculada ao endereço informado, você receberá em instantes um link para redefinir sua senha.
                </p>
                <a href="{% url 'login' %}" class="btn btn-primary mt-2">Voltar para o Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
